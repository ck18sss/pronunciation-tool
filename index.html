<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronunciation Practice</title>
<style>html, body { overflow: auto !important; }</style>
</head>
<body>

<style>
  html, body { overflow: hidden; margin: 0; }
  .app {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 32px;
    text-align: center;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }
  .app h1 {
    font-size: 48px;
    margin: 0 0 6px;
    color: #333;
  }
  .app p {
    color: #888;
    font-size: 18px;
    margin: 0 0 28px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .sound-btn {
    border: none;
    border-radius: 24px;
    height: 180px;
    color: white;
    text-transform: lowercase;
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
    caret-color: transparent;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sound-btn:focus { outline: none; }
  .sound-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    filter: brightness(1.08);
  }
  .sound-btn:active {
    transform: translateY(2px) scale(0.98);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .sound-btn.playing {
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0.0), 0 6px 14px rgba(0,0,0,0.15); }
    50%      { box-shadow: 0 0 0 10px rgba(0,0,0,0.12), 0 6px 14px rgba(0,0,0,0.15); }
  }
</style>

<div class="app">
  <h1>Pronunciation Practice</h1>
  <p>Tap a button to hear the sound</p>
  <div class="grid">
    <button class="sound-btn" data-sound="WR" style="background: #4a90d9;">WR</button>
<button class="sound-btn" data-sound="TH" style="background: #4a90d9;">TH</button>
<button class="sound-btn" data-sound="PH" style="background: #4a90d9;">PH</button>
<button class="sound-btn" data-sound="WH" style="background: #4a90d9;">WH</button>

  </div>
</div>

  const player = new Audio();
  let activeBtn = null;

  document.querySelectorAll('.sound-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (activeBtn) activeBtn.classList.remove('playing');
      player.pause();
      player.src = audioSources[btn.dataset.sound];
      player.currentTime = 0;
      player.play();
      btn.classList.add('playing');
      activeBtn = btn;
      btn.blur();
    });
  });

  player.addEventListener('ended', () => {
    if (activeBtn) activeBtn.classList.remove('playing');
  });
</script>
